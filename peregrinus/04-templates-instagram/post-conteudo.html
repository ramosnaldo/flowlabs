<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#36BFEC;--blue-d:#1A7FA6;--black:#000;--grey:#888888;--light:#D6D6D6;--white:#fff;--m:80px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden}
body{position:relative;font-family:"Inter",sans-serif;background:var(--black);color:var(--white)}
/* FUNDOS: troque a classe do <body>: preto | azul | claro */
body.azul{background:var(--blue);color:var(--black)}
body.claro{background:var(--light);color:var(--black)}
.safe{position:absolute;inset:var(--m);display:flex;flex-direction:column;z-index:3}
.top{display:flex;justify-content:space-between;align-items:center}
.lockup{display:flex;align-items:center;gap:18px}
.lockup svg{height:58px;width:auto;fill:var(--blue)}
body.azul .lockup svg{fill:var(--black)}
.wm{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:.05em;line-height:1;font-size:40px;white-space:nowrap}
.wm .i{display:inline-block;clip-path:polygon(-10% -10%,110% -10%,110% 74%,-10% 92%)}
.tag{display:flex;align-items:center;gap:16px;font-family:"Space Mono",monospace;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
body.azul .tag,body.claro .tag{color:var(--black)}
.tag svg{width:34px;height:34px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:56px}
.eyebrow{font-family:"Instrument Serif",serif;font-style:italic;font-size:54px;line-height:1.1;color:var(--blue);margin-bottom:22px}
body.azul .eyebrow{color:var(--white)}
body.claro .eyebrow{color:var(--blue-d)}
.title{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:150px;line-height:.88;letter-spacing:.005em}
.title em{font-style:normal;color:var(--blue)}
body.azul .title em{color:var(--white)}
body.claro .title em{color:var(--blue-d)}
.body{font-size:34px;line-height:1.45;max-width:860px;margin-top:34px;color:#cfcfcf}
body.azul .body{color:#06212b}
body.claro .body{color:#2a2a2a}
.foot{display:flex;justify-content:space-between;align-items:center;font-family:"Space Mono",monospace;font-size:22px;letter-spacing:.12em;text-transform:uppercase;padding-top:26px;border-top:1.5px solid rgba(255,255,255,.18)}
body.azul .foot,body.claro .foot{border-color:rgba(0,0,0,.2)}
.foot svg{width:96px;height:32px;color:var(--blue)}
body.azul .foot svg{color:var(--black)}
.num{font-family:"Anton",sans-serif;font-size:300px;line-height:.82;color:var(--blue)}
.data{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px;padding-top:26px;border-top:1.5px solid currentColor}
.data span{display:block;font-family:"Space Mono",monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
body.azul .data span{color:#06212b}
.data b{display:block;font-family:"Anton",sans-serif;font-weight:400;font-size:52px;line-height:1;margin-top:10px;text-transform:uppercase}
.chip{display:inline-block;font-family:"Space Mono",monospace;font-size:22px;letter-spacing:.16em;background:var(--blue);color:var(--black);padding:8px 16px;margin-bottom:26px;align-self:flex-start}
body.azul .chip{background:var(--black);color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:22px;align-self:flex-start;margin-top:44px;background:var(--black);color:var(--blue);font-family:"Space Mono",monospace;font-size:26px;letter-spacing:.16em;text-transform:uppercase;padding:24px 34px}
.btn svg{width:84px;height:28px}
.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08);z-index:0}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);z-index:1}
.blk{background:var(--blue);color:var(--black);padding:40px 44px;align-self:flex-start;max-width:900px}
.blk .title{font-size:118px}
.blk .title em{color:var(--white)}
.route{position:absolute;z-index:1;pointer-events:none}

html,body{width:1080px;height:1350px}
</style></head>
